
<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Tính diện tích hình chữ nhật</title>
    <meta charset="UTF-8">
</head>
<body>
    <script>
	let d = Number(prompt("Cho mình chiều dài của hình chữ nhật điiiii"));
	let r = Number(prompt("Cho mình xin tiếp chiều rộng nhóooooooo"));
	if(d<r)
		alert("hong được òiiiii!!!!!!!!!!! Chiều dài phải nhỏ hơn chiều rộng chứ . Đúm hăm. Nhập lại iiiii làm lại cho nìiiii");
	else if(d==r)
		alert("Ahihihi này là TRƯỜNG HỢP ĐẶC BIỆT RỒI Là hinh vuông đấy , tính luôn cho nhó: diện tích hình vuông là" + d*r);
	else
		alert("Đây đây rồi Diện tích hình chữ nhật của bạn là " + d*r);
    </script>
</body>
</html>
