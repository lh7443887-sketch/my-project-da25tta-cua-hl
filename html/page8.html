<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🍽️Trang vui sướng mỗi khi vàoooo🍽️</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="../JS/hl1.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f5f5;
    font-family:Arial, sans-serif;
}

/* HEADER */

.topbar{
    background:#ff6a00;
    padding:15px 40px;

    display:flex;
    align-items:center;
    gap:15px;

    color:white;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.search-box{
    flex:1;
}

.search-box input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
}

.icons{
    font-size:25px;
}

/* BANNER */

.main{
    width:1200px;
    max-width:95%;
    margin:20px auto;

    display:flex;
    gap:20px;
}

.sidebar{
    width:250px;
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.sidebar h4{
    margin-bottom:15px;
}

.sidebar ul{
    list-style:none;
    padding:0;
}

.sidebar li{
    padding:12px 0;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.sidebar li:hover{
    color:#ff6a00;
}

.banner{
    flex:1;
    background:linear-gradient(135deg,#ffd180,#ffb74d);

    border-radius:20px;
    padding:50px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.banner h1{
    font-size:45px;
}

.banner p{
    font-size:20px;
    margin-top:10px;
}

/* PRODUCT */

.section-title{
    width:1200px;
    max-width:95%;
    margin:30px auto 10px;

    font-size:30px;
    font-weight:bold;
}

.card{
    border:none !important;
    border-radius:20px !important;
    overflow:hidden;
    transition:.3s;

    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 15px 30px rgba(0,0,0,.2);
}

.card-img-top{
    width:100%;
    height:220px;
    object-fit:cover;
}

.btn-danger{
    border-radius:10px;
}

.container{
    max-width:1200px;
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="topbar">

    <div class="logo">
        🍽️ Foodie Buddy 🍽️
    </div>

    <div class="search-box">
        <input type="text" placeholder="Tìm món ăn yêu thích...">
    </div>

    <div class="icons">
        🛒 ❤️ 👤
    </div>

</div>

<!-- MENU + BANNER -->

<div class="main">

    <div class="sidebar">

        <h4>Danh mục</h4>

        <ul>
            <li>🍜 Mỳ cay</li>
            <li>🍲 Bún đậu</li>
            <li>🍣 Sushi</li>
            <li>🍗 Gà rán</li>
            <li>🍤 Hải sản</li>
            <li>🍺 Đồ uống</li>
        </ul>

    </div>

    <div class="banner">

        <h1>🔥 KHUYẾN MÃI 50%</h1>

        <p>
            Áp dụng cho các món ăn bán chạy hôm nay
        </p>

    </div>

</div>

<!-- SẢN PHẨM -->

<div class="section-title">
    🔥 Món ăn nổi bật
</div>

<div class="container">

    <div id="product-list" class="row g-4">

    </div>

</div>

<script>

loadAllProducts(products);

</script>

</body>
</html>
